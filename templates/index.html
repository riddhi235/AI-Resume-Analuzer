<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: auto;">
    <h1>AI Resume Analyzer</h1>
    <p>Upload your resume and compare it with a job description.</p>

    <!-- Backend HTML Form -->
    <form action="/" method="POST" enctype="multipart/form-data">
        <div style="margin-bottom: 20px;">
            <label><b>Upload Resume (PDF):</b></label><br><br>
            <input type="file" name="resume" required>
        </div>

        <div style="margin-bottom: 20px;">
            <label><b>Job Description:</b></label><br><br>
            <textarea name="job_description" rows="5" cols="50" placeholder="Paste job description here..." required></style="width: 100%;"></textarea>
        </div>

        <button type="submit" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer;">Analyze Resume</button>
    </form>
</body>
</html>
